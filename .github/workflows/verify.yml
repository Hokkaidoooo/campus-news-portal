name: Build and real deployment verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests, WAR and isolated MySQL/Tomcat/browser tests
        env:
          NEWS_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
          NEWS_TEST_MYSQL_USER: root
          NEWS_TEST_MYSQL_PASSWORD: ci-only-password
        run: mvn -B clean -Pintegration verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-verification
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/portal-it-*/server.log
            target/portal-it-*/browser.log
            target/portal-it-*/browser-*.png
