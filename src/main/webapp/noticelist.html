<!DOCTYPE html>


<html lang="en">
<head>

    <title>河海大学商学院</title>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <link rel="shortcut icon" href="images/bitbug_favicon.ico">
    <link href="css/com.css" rel="stylesheet" type="text/css"/>
    <link href="css/font-awesome.css" rel="stylesheet" type="text/css"/>
    <link href="css/bootstrap.css" rel="stylesheet" type="text/css"/>
    <link href="css/index.css" rel="stylesheet" type="text/css"/>
    <script src="js/jquery.min.js"></script>
    <script src="js/banner.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/album_two.js"></script>
    <script src="js/vue2.7.14.js"></script>
    <script src="js/axios.min.js"></script>
<script src="./js/portal-config.js"></script>
</head>

<body>
<div id="ibody">
    <div id="head">
        <div class="head_box">
            <div class="logo_box">
                <img src="images/logo.jpg"/>
            </div>
            <div class="nav_box">
                <ul class="nav_menu1">
                    <li class="nav_one" v-for="item in menuItems" :key="item.Id">
                        <a @click="handleMenuClick(item)" class="nav_a"  target="_blank">{{ item.TopmenuName }}</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>


    <div id="main" style="margin-top: 30px">
        <div class="main_box1">
            <div class="main_index1" >
                <div class="main_date" >
                    <div style="font-size: 30px; width: 100%;text-align: center;margin-bottom: 20px">
                        <span class="name_c">全部公告</span><span class="name_e">- Notice</span>
                    </div>
                    <div class="main_sub_con">
                        <div class="news_columns">
                            <ul class="new_txt column">
                                <li v-for="notice in noticeList" :key="notice.NoticeID">
                                    <div class="li_icon"></div>
                                    <div class="li_title">
                                        <a target="_blank">{{ notice.NoticeName }}</a>
                                    </div>
                                    <div class="li_time">{{ notice.createTime }}</div>
                                </li>
                            </ul>
                            <ul class="new_txt column">
                                <li v-for="notice in noticeList" :key="notice.NoticeID">
                                    <div class="li_icon"></div>
                                    <div class="li_title">
                                        <a target="_blank">{{ notice.NoticeName }}</a>
                                    </div>
                                    <div class="li_time">{{ notice.createTime }}</div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
<script type="text/javascript" src="js/menu.js"></script>
<script type="text/javascript" src="js/lunbo.js"></script>
<script type="text/javascript" src="js/index.js"></script>
</body>
</html>
